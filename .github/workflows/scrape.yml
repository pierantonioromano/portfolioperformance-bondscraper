name: Scrape Bond Prices

on:
  schedule:
    # Run at 16:00 UTC (18:00 IT time - right after 17:35 market close) and 19:00 UTC (21:00 IT time - evening safety catch)
    - cron: '0 16,19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bond Scraper
        run: |
          python scraper.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add out/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update daily bond prices [skip ci]" -m "Automated daily bond scraper run by GitHub Actions."
            git push
          fi
